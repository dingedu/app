<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ding! Kids Club — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* warna diambil dari logo Ding! Kids Club */
  --blue:#2C7FDB; --blue-d:#1D61B0; --blue-50:#E7F0FC; --blue-100:#CDE0F8;
  --coral:#EF6B6B; --coral-d:#C84B4B; --coral-50:#FDEDED;
  --teal:#11A0B4; --teal-d:#0B7C8C; --teal-50:#DDF3F6;
  --mint:#8FD6C2; --mint-d:#2F9C7E; --mint-50:#E5F6F0;
  --yellow:#F6C431; --yellow-d:#C99A0E; --yellow-50:#FEF6DA;
  --red:#D93F3F; --red-50:#FDECEC;
  --ink:#24324A; --ink-2:#56627A; --muted:#8A93A6; --line:#E6ECF3;
  --bg:#F7F9FC; --card:#FFFFFF;
  --r:18px; --r-sm:12px;
  --shadow:0 2px 0 rgba(36,50,74,.03), 0 10px 26px -14px rgba(44,127,219,.28);
  --font-h:'Fredoka', 'Nunito', system-ui, sans-serif;
  --font-b:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;line-height:1.2;letter-spacing:.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.b{font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}.g2:not(.keep){grid-template-columns:1fr}}

/* ---------- brand stripe ---------- */
.stripe{display:flex;height:6px;border-radius:6px;overflow:hidden}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--coral)} .stripe i:nth-child(2){background:var(--teal)} .stripe i:nth-child(3){background:var(--blue)} .stripe i:nth-child(4){background:var(--mint)} .stripe i:nth-child(5){background:var(--yellow)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);transition:transform .08s, filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 12px;font-size:13px;box-shadow:0 2px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 var(--line)}
.btn.yellow{background:var(--yellow);color:var(--ink);box-shadow:0 3px 0 var(--yellow-d)}
.btn.teal{background:var(--teal);box-shadow:0 3px 0 var(--teal-d)}
.btn.green{background:var(--mint-d);box-shadow:0 3px 0 #1F7A61}
.btn.coral{background:var(--coral);box-shadow:0 3px 0 var(--coral-d)}
.btn.wa{background:#25D366;box-shadow:0 3px 0 #179C4A}
.btn.red{background:var(--red);box-shadow:0 3px 0 #A92B2B}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;color:var(--ink-2);flex-shrink:0}
.icon-btn:hover{background:var(--blue-50);color:var(--blue)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.danger:hover{background:var(--red-50);color:var(--red)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:800;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s;min-width:0}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-50)}
.input[readonly]{background:#F5F7FA}
textarea.input{min-height:76px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid,.form-grid.three{grid-template-columns:1fr}}
.sec-title{font-family:var(--font-h);font-size:15px;color:var(--blue-d);margin:6px 0 -2px;grid-column:1/-1}
.radio-pills{display:flex;gap:6px;flex-wrap:wrap}
.radio-pills label{display:inline-flex}
.radio-pills input{display:none}
.radio-pills span{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--ink-2);cursor:pointer;background:#fff}
.radio-pills input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #EAF0F7;padding:18px;min-width:0}
.card h3{font-size:18px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.stat .val{font-family:var(--font-h);font-size:25px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.stat .sub{font-size:12px;color:var(--ink-2)}
.bg-blue{background:var(--blue-50)} .bg-coral{background:var(--coral-50)} .bg-teal{background:var(--teal-50)} .bg-mint{background:var(--mint-50)} .bg-yellow{background:var(--yellow-50)} .bg-red{background:var(--red-50)} .bg-gray{background:#F1F4F8}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.b-green{background:var(--mint-50);color:#1F7A61}
.b-red{background:var(--red-50);color:#A92B2B}
.b-yellow{background:var(--yellow-50);color:#8A6500}
.b-blue{background:var(--blue-50);color:var(--blue-d)}
.b-teal{background:var(--teal-50);color:var(--teal-d)}
.b-coral{background:var(--coral-50);color:var(--coral-d)}
.b-gray{background:#EEF1F6;color:var(--ink-2)}
.b-ink{background:var(--ink);color:#fff}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.warn td{background:#FFF8F8}
.t tr.warn td:first-child{box-shadow:inset 4px 0 0 var(--coral)}
.t tfoot td{font-weight:800;border-top:1.5px solid var(--line);background:#FAFBFD}
.t .c{text-align:center}
.t .r{text-align:right}
.t td.act{white-space:nowrap;text-align:right}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 16px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;font-weight:800;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(circle at 10% 15%, var(--coral-50) 0 120px, transparent 121px),
  radial-gradient(circle at 92% 85%, var(--mint-50) 0 170px, transparent 171px),
  radial-gradient(circle at 88% 10%, var(--yellow-50) 0 90px, transparent 91px),
  radial-gradient(circle at 6% 90%, var(--blue-50) 0 110px, transparent 111px), var(--bg)}
.login-card{width:100%;max-width:410px;background:#fff;border-radius:28px;padding:26px 24px;box-shadow:0 24px 50px -26px rgba(44,127,219,.5);text-align:center;overflow:hidden;position:relative}
.login-card .stripe{position:absolute;left:0;right:0;top:0;border-radius:0;height:7px}
.login-card .logo{width:150px;height:150px;margin:0 auto 2px;display:block;border-radius:24px}
.login-card h1{font-size:22px}
.login-card .tabs{margin:16px 0 14px;justify-content:center}
.login-card .tabs button{flex:1;padding:8px 10px}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login-hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.demo-box{margin-top:16px;background:var(--yellow-50);border-radius:14px;padding:10px 12px;font-size:12.5px;text-align:left;color:#6B5200}
.demo-box b{color:var(--ink)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px}
.brand img{width:50px;height:50px;border-radius:12px}
.brand b{font-family:var(--font-h);font-size:18px;display:block;line-height:1.1;color:var(--ink)}
.brand span{font-size:12px;color:var(--muted);font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;font-weight:700;color:var(--ink-2);text-align:left;width:100%}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:var(--blue-50);color:var(--blue)}
.nav-item.on{background:var(--blue);color:#fff}
.nav-item .cnt{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nav-item.on .cnt{background:#fff;color:var(--coral-d)}
.nav-sep{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:12px 12px 4px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 26px;position:sticky;top:0;z-index:20;background:rgba(247,249,252,.92);backdrop-filter:blur(8px)}
.topbar h2{font-size:22px}
.topbar .menu-btn,.topbar .home-btn,.mobile-only{display:none!important}
.content{padding:6px 26px 48px;display:flex;flex-direction:column;gap:16px;max-width:1260px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.user-pill .role{font-size:11px;color:var(--muted);display:block;line-height:1}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-family:var(--font-h);font-weight:700;color:var(--ink);font-size:13px;flex-shrink:0}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;opacity:.88}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(36,50,74,.35);z-index:55}
  .topbar{padding:12px 16px}
  .topbar .menu-btn,.topbar .home-btn{display:inline-grid!important}
  .nav-item.mobile-only{display:flex!important}
  .topbar h2{font-size:19px}
  .user-pill .nm{display:none}
  .content{padding:4px 16px 48px}
}

/* ---------- beranda ---------- */
.hero{background:#fff;border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero img{width:76px;height:76px;flex-shrink:0;border-radius:16px}
.hero h2{font-size:22px}
.hero p{color:var(--ink-2)}
.hero .stripe{position:absolute;left:0;right:0;bottom:0;border-radius:0;height:5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;color:var(--ink);text-align:center;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile svg{width:30px;height:30px;color:var(--ink-2)}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{padding:13px 6px;font-size:12.5px;line-height:1.25}.tile svg{width:25px;height:25px}.hero{padding:16px;gap:12px}.hero img{width:56px;height:56px}.hero h2{font-size:19px}.hero p{font-size:13.5px}}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{min-width:0;flex:1}
.li .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:600}
.note{border-radius:14px;padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}

/* status absensi */
.seg{display:inline-flex;background:#F0F3F8;border-radius:12px;padding:3px;gap:2px;flex-shrink:0}
.seg button{min-width:36px;padding:6px 8px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button.on.H{background:var(--mint-d);color:#fff}
.seg button.on.I{background:var(--blue);color:#fff}
.seg button.on.S{background:var(--yellow);color:var(--ink)}
.seg button.on.A{background:var(--coral);color:#fff}
.att-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att-row:last-child{border-bottom:0}
.att-row .meta{flex:1;min-width:160px}
.att-row .meta b{display:block}

/* paket / sisa */
.enrol-card{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.enrol-card.habis{border-color:#F5B9B9;background:#FFFBFB}
.enrol-card.hampir{border-color:#F3DC8C}
.sisa-big{font-family:var(--font-h);font-size:34px;font-weight:600;line-height:1}
.bar{height:9px;background:#EEF2F7;border-radius:9px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pk{border-radius:12px;background:#F7F9FC;padding:10px 12px;font-size:13px}
.pk-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* kelas group */
.kelas-card{border-radius:18px;background:#fff;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--teal)}
.kelas-card h4{font-size:17px}

/* bars keuangan */
.hbar{height:10px;border-radius:6px;background:var(--blue-100)}
.hbar.b2{background:var(--mint)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(36,50,74,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:22px;width:100%;max-width:580px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:900px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:19px;flex:1}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(247,249,252,.6);z-index:150}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--blue-100);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* invoice / slip */
.inv{font-family:var(--font-b);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.inv .stripe{position:absolute;left:0;right:0;top:0;border-radius:0}
.inv-h{display:flex;gap:12px;align-items:center;border-bottom:2px dashed var(--blue-100);padding-bottom:14px;margin-bottom:14px}
.inv-h img{width:70px;height:70px;border-radius:14px}
.inv-h h2{font-size:20px}
.inv table{width:100%;border-collapse:collapse;font-size:14px}
.inv td{padding:6px 0;vertical-align:top}
.inv .tot{font-family:var(--font-h);font-size:24px;color:var(--blue-d)}
.stamp{position:absolute;right:18px;top:96px;transform:rotate(-12deg);border:3px solid;border-radius:10px;padding:4px 12px;font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:1px;opacity:.85}
.stamp.paid{color:var(--mint-d);border-color:var(--mint-d)}
.stamp.unpaid{color:var(--red);border-color:var(--red)}

/* portal guru & ortu */
.p-top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:920px;margin:0 auto;width:100%}
.p-top img{width:46px;height:46px;border-radius:12px}
.p-wrap{max-width:920px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:16px;width:100%}
.kid-hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,var(--blue) 0%,var(--teal) 100%);color:#fff;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.kid-hero h2{font-size:24px}
.kid-hero .pill{display:inline-block;margin-top:8px;background:rgba(255,255,255,.22);padding:4px 12px;border-radius:999px;font-weight:800;font-size:13px}
.kid-hero:after{content:"";position:absolute;right:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:var(--yellow);opacity:.9}
.kid-hero:before{content:"";position:absolute;right:90px;top:-30px;width:70px;height:70px;border-radius:50%;background:var(--coral);opacity:.9}

@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}

/* ---------------- storage aman ---------------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (DEMO) {
      await new Promise(r => setTimeout(r, 90));
      res = DemoServer.handle(JSON.parse(JSON.stringify(req)));
    } else {
      let r;
      try {
        r = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/, '') + '/rest/v1/rpc/ding_api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY },
          body: JSON.stringify({ req })
        });
      } catch (e) { throw new Error('Tidak bisa terhubung ke server. Cek koneksi internet.'); }
      if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error(m || ('Server error ' + r.status)); }
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'SESSION') { logout(true); }
      throw new Error(res.message || res.error || 'Terjadi kesalahan');
    }
    return res;
  } finally { if (!opts.silent) loading(false); }
}

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const N = v => num_(v);
const rp = n => (n < 0 ? '-' : '') + 'Rp' + Math.round(Math.abs(Number(n) || 0)).toLocaleString('id-ID');
const rpk = n => { n = Number(n) || 0; const a = Math.abs(n); return (n < 0 ? '-' : '') + (a >= 1e6 ? 'Rp' + (a / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' jt' : rp(a)); };
const pad = n => String(n).padStart(2, '0');
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const thisPeriod = () => todayStr().slice(0, 7);
const fmtDate = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d && BULAN[+m - 1] ? `${+d} ${BULAN[+m - 1].slice(0, 3)} ${y}` : s; };
const fmtDateLong = s => { if (!s) return '-'; const [y, m, d] = String(s).split('-'); return d && BULAN[+m - 1] ? `${+d} ${BULAN[+m - 1]} ${y}` : s; };
const fmtPeriod = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${BULAN[+m - 1]} ${y}`; };
const addMonths = (p, n) => { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const dayName = s => HARI[new Date(s + 'T00:00:00').getDay()];
const initials = n => (String(n || '?').replace(/\(.*?\)/g, '').replace(/[^A-Za-z\s]/g, '').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('') || '?').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const fmtN = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('id-ID');
function waNum(n) { n = String(n || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); else if (n.startsWith('8')) n = '62' + n; return n; }
function waLink(n, text) { return `https://wa.me/${waNum(n)}?text=${encodeURIComponent(text)}`; }
function openWa(n, text) { if (!waNum(n)) return toast('Nomor WhatsApp belum diisi', true); window.open(waLink(n, text), '_blank'); }
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = String(v).trim()); return o; }
function monthOptions(sel, back = 12, fwd = 1) {
  const cur = thisPeriod(); let out = '';
  for (let i = fwd; i >= -back; i--) { const p = addMonths(cur, i); out += `<option value="${p}" ${p === sel ? 'selected' : ''}>${fmtPeriod(p)}</option>`; }
  return out;
}
function downloadFile(name, content, type = 'text/csv;charset=utf-8') {
  try {
    const blob = new Blob(['﻿' + content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast('Unduhan tidak didukung di tampilan ini', true); }
}

let toastT;

  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2800);
}
let loadingN = 0;
function loading(on) {
  loadingN += on ? 1 : -1; if (loadingN < 0) loadingN = 0;
  let l = $('#loading'); if (!l) { l = document.createElement('div'); l.id = 'loading'; l.className = 'loading hidden'; l.innerHTML = '<div class="spin"></div>'; document.body.appendChild(l); }

}
function modal(title, body, foot = '', wide = false) {
  closeModal();

  m.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div><div class="modal-b">${body}</div>${foot ? `<div class="modal-f">${foot}</div>` : ''}</div>`;
  m.addEventListener('mousedown', e => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
  const f = m.querySelector('input:not([type=hidden]):not([readonly]),select,textarea'); if (f && window.innerWidth > 700) setTimeout(() => f.focus(), 50);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }

/* ---------------- ROUTER ---------------- */

function route_(req) {
  const a = req.action;
  if (a === 'ping') return { ok: true, time: new Date().toISOString() };
  if (a === 'login') return login_(req);
  if (a === 'publicSettings') return { ok: true, settings: publicSettings_() };

  const s = getSession_(req.token);
  if (!s) return { ok: false, error: 'SESSION', message: 'Sesi berakhir, silakan login kembali.' };
  if (a === 'logout') { ENV.cacheDel('s_' + req.token); return { ok: true }; }

  if (s.role === 'owner' || s.role === 'admin') {
    const allowed = s.role === 'owner' ? TABLES_OWNER : TABLES_ADMIN;
    const chk = t => { if (allowed.indexOf(t) < 0) throw new Error('Tidak punya akses ke data ' + t); };
    switch (a) {
      case 'bootstrap':      return { ok: true, data: bootstrap_(s) };
      case 'save':           chk(req.table); return { ok: true, row: ENV.lock(() => upsertMany_(req.table, [clean_(req.table, req.row, s)])[0]) };
      case 'saveMany':       chk(req.table); return { ok: true, rows: ENV.lock(() => upsertMany_(req.table, (req.rows || []).map(r => clean_(req.table, r, s)))) };
      case 'remove':         chk(req.table); ENV.lock(() => removeRow_(req.table, req.id)); return { ok: true };
      case 'saveSesi':       return { ok: true, data: ENV.lock(() => saveSesi_(s, req)) };
      case 'delSesi':        ENV.lock(() => delSesi_(s, req.id)); return { ok: true };
      case 'saveSettings':   ENV.lock(() => saveSettings_(req.settings || {})); return { ok: true, settings: getSettings_() };
      case 'changePassword': return changePassword_(s, req);
      case 'resetUser':      if (s.role !== 'owner') break; return resetUser_(req);
    }
  }
  if (s.role === 'guru') {
    switch (a) {
      case 'guruData': return { ok: true, data: guruData_(s) };
      case 'saveSesi': return { ok: true, data: ENV.lock(() => saveSesi_(s, req)) };
      case 'delSesi':  ENV.lock(() => delSesi_(s, req.id)); return { ok: true };
    }
  }
  if (s.role === 'ortu' && a === 'me') return { ok: true, data: me_(s) };
  return { ok: false, error: 'Akses ditolak' };
}

// admin tidak boleh menimpa kolom fee tarif (kalaupun dikirim)
function clean_(table, row, s) {
  const r = Object.assign({}, row || {});
  if (table === 'Guru' && r.pin === undefined) delete r.pin;
  return r;
}

/* ---------------- AUTH ---------------- */

function login_(req) {
  const role = String(req.role || '');
  const user = String(req.user || '').trim();
  const pass = String(req.pass || '').trim();
  if (!user || !pass) return { ok: false, error: 'Lengkapi data login.' };
  let profile = null, realRole = role;
  if (role === 'staff') {
    const u = readTable_('Users').find(r => String(r.username).toLowerCase() === user.toLowerCase());
    if (u && u.passwordHash === ENV.hash(pass)) { profile = { id: u.id, nama: u.nama, username: u.username }; realRole = u.role === 'owner' ? 'owner' : 'admin'; }
  } else if (role === 'guru') {
    lengkapiDataGuru();
    const g = readTable_('Guru').find(r => String(r.id).toUpperCase() === user.toUpperCase());
    if (g && String(g.pin) === pass && g.status !== 'Nonaktif') profile = { id: g.id, nama: g.nama };
  } else if (role === 'ortu') {
    lengkapiDataSiswa();
    const x = readTable_('Siswa').find(r => String(r.id).toUpperCase() === user.toUpperCase());
    if (x && String(x.kodeOrtu) === pass && x.status !== 'Berhenti') profile = { id: x.id, nama: x.nama, panggilan: x.panggilan };
  }
  if (!profile) return { ok: false, error: role === 'staff' ? 'Username atau password salah.' : role === 'guru' ? 'ID guru atau PIN salah.' : 'ID murid atau kode akses salah.' };
  const token = ENV.uuid();
  ENV.cachePut('s_' + token, JSON.stringify({ role: realRole, uid: profile.id }), SESSION_SECONDS);
  return { ok: true, token: token, role: realRole, profile: profile };
}

function getSession_(token) {
  if (!token) return null;
  const v = ENV.cacheGet('s_' + token);
  if (!v) return null;
  ENV.cachePut('s_' + token, v, SESSION_SECONDS);
  return JSON.parse(v);
}

function changePassword_(s, req) {
  const u = readTable_('Users').find(r => r.id === s.uid);
  if (!u || u.passwordHash !== ENV.hash(String(req.oldPass || ''))) return { ok: false, error: 'Password lama salah.' };
  if (String(req.newPass || '').length < 6) return { ok: false, error: 'Password baru minimal 6 karakter.' };
  u.passwordHash = ENV.hash(String(req.newPass));
  ENV.lock(() => upsertMany_('Users', [u]));
  return { ok: true };
}

function resetUser_(req) {
  const uname = String(req.username || '').trim();
  const pass = String(req.newPass || '');
  if (!uname || pass.length < 6) return { ok: false, error: 'Username wajib & password minimal 6 karakter.' };
  const u = readTable_('Users').find(r => String(r.username).toLowerCase() === uname.toLowerCase());
  const row = u ? Object.assign({}, u) : { username: uname, nama: req.nama || uname, role: req.role === 'owner' ? 'owner' : 'admin' };
  row.passwordHash = ENV.hash(pass);
  if (req.nama) row.nama = req.nama;
  ENV.lock(() => upsertMany_('Users', [row]));
  return { ok: true, users: safeUsers_() };
}

const STATUS_HADIR = ['Hadir', 'Izin', 'Sakit', 'Alpa'];

function saveSesi_(s, req) {
  const src = req.sesi || {};
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(src.tanggal || ''))) throw new Error('Tanggal sesi tidak valid.');
  const enrolAll = readTable_('Enrol');
  let old = null;
  if (src.id) old = readTable_('Sesi').find(x => x.id === src.id);
  if (s.role === 'guru') {
    if (old && old.guruId !== s.uid) throw new Error('Sesi ini diinput guru lain.');
    src.guruId = s.uid;
  }
  if (!src.guruId) throw new Error('Guru pengajar wajib dipilih.');
  const sesi = {
    tanggal: src.tanggal, jam: String(src.jam || ''), tipe: src.tipe === 'Group' ? 'Group' : 'Private',
    kelasId: String(src.kelasId || ''), guruId: src.guruId, durasi: String(src.durasi || ''), lokasi: String(src.lokasi || ''),
    materi: String(src.materi || ''), catatan: String(src.catatan || ''), inputOleh: s.role + ':' + s.uid, asisten: String(src.asisten || '')
  };
  if (old) sesi.id = old.id;
  const rows = (req.hadir || []).filter(h => STATUS_HADIR.indexOf(h.status) > -1).map(h => {
    const e = enrolAll.find(x => x.id === h.enrolId);
    if (!e) throw new Error('Pendaftaran kelas murid tidak ditemukan.');
    const mode = s.role === 'guru' ? '' : (['bebas', 'potong'].indexOf(h.mode) > -1 ? h.mode : '');
    return { siswaId: e.siswaId, enrolId: e.id, status: h.status, catatan: String(h.catatan || ''), mode: mode };
  });
  if (!rows.length) throw new Error('Isi absensi minimal satu murid.');
  const saved = upsertMany_('Sesi', [sesi])[0];
  removeWhere_('Hadir', h => h.sesiId === saved.id);
  const hs = upsertMany_('Hadir', rows.map(r => Object.assign(r, { sesiId: saved.id })));
  return { sesi: saved, hadir: hs };
}

function delSesi_(s, id) {
  const old = readTable_('Sesi').find(x => x.id === id);
  if (!old) return;
  if (s.role === 'guru' && old.guruId !== s.uid) throw new Error('Sesi ini diinput guru lain.');
  removeRow_('Sesi', id);
  removeWhere_('Hadir', h => h.sesiId === id);
}

/* ---------------- UTIL TANGGAL ---------------- */
function addDays_(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function addMonthsIso_(iso, n) {
  const p = String(iso || '').split('-').map(Number); if (!p[0]) return '';
  let y = p[0], m = p[1] + n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; }
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return y + '-' + String(m).padStart(2, '0') + '-' + String(Math.min(p[2] || 1, last)).padStart(2, '0');
}
function num_(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v == null ? '' : v).replace(/[^\d.,-]/g, '');
  if (!s) return 0;
  if (/^-?\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, '');      // 1.600.000 / 1,600,000
  else if (s.indexOf(',') > -1 && s.indexOf('.') < 0) s = s.replace(',', '.'); // 66,67
  else s = s.replace(/,/g, '');
  return Number(s) || 0;
}

/* ================================================================
 *  ENGINE — dihitung ulang dari data mentah setiap kali dibutuhkan
 *  • Paket: kredit = sesi + bonus. Nilai per sesi = total bayar ÷ kredit.
 *  • Pemakaian FIFO per pendaftaran kelas (paket terlama dipakai dulu).
 *  • Hadir → sesi terpotong. Izin/Sakit → pakai jatah izin paket (tidak
 *    terpotong); lewat jatah → terpotong (hangus) sesuai pengaturan.
 *    Alpa → terpotong (hangus) sesuai pengaturan.
 *  • Pindah kelas: baris Pembelian jenis "Pindahan" (asalId = paket asal)
 *    mengurangi kredit paket asal & menambah kredit di kelas tujuan.
 *  • Revenue diakui saat sesi terpakai (bukan saat bayar) → tahu berapa
 *    yang "dipotong" tiap bulan + saldo paket yang belum terpakai.
 *  • Fee guru private  = (nilai kelas × durasi/standar − admin fee) × %guru
 *                        (atau fee manual), + transport (home service).
 *  • Fee guru group    = tabel TarifGroup sesuai jumlah murid HADIR.
 *  • Referral          = % × (nilai − admin) selama N bulan sejak murid daftar.
 * ================================================================ */
function engine_(db, st) {
  st = st || {};
  const T = n => db[n] || [];
  const byId = arr => { const m = {}; arr.forEach(r => m[r.id] = r); return m; };
  const enrolM = byId(T('Enrol')), sesiM = byId(T('Sesi')), tarifM = byId(T('TarifPrivat')), siswaM = byId(T('Siswa'));
  const std = num_(st.durasiStandar) || 45;
  const alpaPotong = st.alpaPotong !== 'Tidak';
  const izinPotong = st.izinLewatJatah !== 'Tidak';
  const guruAlpa = st.guruDibayarAlpa !== 'Tidak';
  const admGroupPct = num_(st.adminFeeGroup);
  const refGroupPct = num_(st.referralPersen);
  const refBulan = num_(st.referralBulan) || 3;
  const warnN = st.warnSisa === undefined ? 1 : num_(st.warnSisa);

  /* ---- paket ---- */
  const pkgs = {}, byEnrol = {};
  T('Pembelian').forEach(p => {
    if (p.status === 'Batal') return;
    const credits = num_(p.sesi) + num_(p.bonus);
    if (credits <= 0) return;
    const awal = Math.max(0, num_(p.terpakaiAwal));
    const k = { id: p.id, p: p, enrolId: p.enrolId, siswaId: p.siswaId, credits: credits, izinQuota: num_(p.jatahIzin),
      perCredit: num_(p.total) / credits, usedN: awal, awal: awal, izinUsed: 0, hangusN: 0, movedOut: 0, moves: [], events: [], tgl: p.tglBeli || '' };
    pkgs[p.id] = k; (byEnrol[p.enrolId] = byEnrol[p.enrolId] || []).push(k);
  });
  T('Pembelian').forEach(p => {
    if (p.status === 'Batal' || !p.asalId || !pkgs[p.asalId]) return;
    pkgs[p.asalId].movedOut += num_(p.sesi) + num_(p.bonus);
    pkgs[p.asalId].moves.push(p);
  });
  Object.keys(byEnrol).forEach(e => byEnrol[e].sort((a, b) => (a.tgl).localeCompare(b.tgl) || String(a.id).localeCompare(String(b.id))));

  /* ---- absensi → pemakaian sesi ---- */
  const evs = [];
  T('Hadir').forEach(h => { const s = sesiM[h.sesiId]; if (s) evs.push({ h: h, s: s }); });
  evs.sort((a, b) => (a.s.tanggal + (a.s.jam || '')).localeCompare(b.s.tanggal + (b.s.jam || '')));
  const events = [];
  evs.forEach(x => {
    const h = x.h, s = x.s, eid = h.enrolId;
    const list = byEnrol[eid] || [];
    const avail = list.find(k => k.usedN + k.movedOut < k.credits);
    const ev = { id: h.id, sesiId: s.id, tgl: s.tanggal, jam: s.jam, siswaId: h.siswaId, enrolId: eid, status: h.status, guruId: s.guruId,
      kelasId: s.kelasId, tipe: s.tipe, durasi: num_(s.durasi), mode: '', charge: false, pkgId: '', value: 0, kurang: false };
    ev.override = h.mode || '';
    if (h.mode === 'bebas' && h.status !== 'Hadir') {
      const cur = avail || list[list.length - 1];
      ev.mode = 'izin'; if (cur) { cur.izinUsed++; ev.pkgId = cur.id; cur.events.push(ev); }
    }
    else if (h.mode === 'potong' && h.status !== 'Hadir') { ev.mode = 'hangus'; ev.charge = true; }
    else if (h.status === 'Hadir') { ev.mode = 'pakai'; ev.charge = true; }
    else if (h.status === 'Alpa') { ev.mode = alpaPotong ? 'hangus' : 'bebas'; ev.charge = alpaPotong; }
    else {
      const cur = avail || list[list.length - 1];
      if (cur && cur.izinUsed < cur.izinQuota) { ev.mode = 'izin'; cur.izinUsed++; ev.pkgId = cur.id; cur.events.push(ev); }
      else if (izinPotong) { ev.mode = 'hangus'; ev.charge = true; }
      else ev.mode = 'bebas';
    }
    if (ev.charge) {
      if (avail) { avail.usedN++; if (ev.mode === 'hangus') avail.hangusN++; ev.pkgId = avail.id; ev.value = avail.perCredit; ev.pkg = avail; avail.events.push(ev); }
      else ev.kurang = true;
    }
    events.push(ev);
  });

  /* ---- ringkasan per pendaftaran ---- */
  const enrol = {};
  T('Enrol').forEach(e => {
    const list = byEnrol[e.id] || [];
    const credits = list.reduce((a, k) => a + k.credits, 0);
    const used = list.reduce((a, k) => a + k.usedN, 0);
    const moved = list.reduce((a, k) => a + k.movedOut, 0);
    const izin = list.reduce((a, k) => a + k.izinUsed, 0);
    const kurang = events.filter(v => v.enrolId === e.id && v.kurang).length;
    const sisa = credits - used - moved - kurang;
    enrol[e.id] = { id: e.id, credits: credits, used: used, moved: moved, izin: izin, kurang: kurang, sisa: sisa, pkgs: list.map(k => k.id),
      warn: sisa <= 0 ? 'habis' : sisa <= warnN ? 'hampir' : '' };
    list.forEach(k => k.sisa = k.credits - k.usedN - k.movedOut);
  });

  /* ---- tarif ---- */
  const tarifFor = (e, guruId, tgl, pkg) => {
    const pt = pkg && pkg.p.tarifId ? tarifM[pkg.p.tarifId] : null;
    if (pt && (!guruId || pt.guruId === guruId)) return pt;
    let t = tarifM[e.tarifId];
    if (t && (!guruId || t.guruId === guruId)) return t;
    const cand = T('TarifPrivat').filter(r => r.guruId === guruId && r.kategori === (t ? t.kategori : e.kategori) && r.lokasi === (t ? t.lokasi : e.lokasi) && r.aktif !== 'Tidak' && (r.tglBerlaku || '') <= tgl)
      .sort((a, b) => (b.tglBerlaku || '').localeCompare(a.tglBerlaku || '') || String(b.versi).localeCompare(String(a.versi)));
    return cand[0] || null;
  };
  const groupFee = (guruId, tgl, n) => {
    if (n <= 0) return 0;
    const rows = T('TarifGroup').filter(r => r.guruId === guruId && (r.tglBerlaku || '') <= tgl);
    if (!rows.length) return 0;
    const latest = rows.reduce((a, r) => (r.tglBerlaku > a ? r.tglBerlaku : a), '');
    const cur = rows.filter(r => r.tglBerlaku === latest).sort((a, b) => num_(a.jumlahMurid) - num_(b.jumlahMurid));
    let pick = null; cur.forEach(r => { if (num_(r.jumlahMurid) <= n) pick = r; });
    return num_((pick || cur[0]).feeGuru);
  };
  const refInfo = (siswaId, tgl, pkg) => {
    if (pkg && (pkg.p.referralGuruId || pkg.p.referralNama)) return { nama: pkg.p.referralNama || '', guruId: pkg.p.referralGuruId || '' };
    const x = siswaM[siswaId];
    if (!x || !(x.referralDari || x.referralGuruId) || !x.tglDaftar) return null;
    const end = addMonthsIso_(x.tglDaftar, refBulan);
    if (tgl < x.tglDaftar || tgl >= end) return null;
    return { nama: x.referralDari || '', guruId: x.referralGuruId || '' };
  };

  /* ---- keuangan per kejadian ---- */
  const fin = [];      // per murid per sesi (private: fee guru di sini)
  const groupSesi = {}; // per sesi group (fee guru group di sini)
  events.forEach(ev => {
    const e = enrolM[ev.enrolId] || {};
    const isGroup = (e.tipe || ev.tipe) === 'Group';
    const f = { ev: ev, tipe: isGroup ? 'Group' : 'Private', kategori: isGroup ? 'Group Class' : (e.kategori || 'Private'), lokasi: isGroup ? '' : (e.lokasi || ''),
      nilai: ev.value, feeGuru: 0, travel: 0, admin: 0, classroom: 0, referral: 0, refNama: '', refGuruId: '', guruId: ev.guruId, tarifMissing: false };
    if (isGroup) {
      const g = groupSesi[ev.sesiId] || (groupSesi[ev.sesiId] = { sesiId: ev.sesiId, tgl: ev.tgl, guruId: ev.guruId, kelasId: ev.kelasId, n: 0, nilai: 0, fee: 0 });
      if (ev.status === 'Hadir') g.n++;
      g.nilai += ev.value;
      if (ev.value) {
        f.admin = Math.round(ev.value * admGroupPct / 100);
        const r = refInfo(ev.siswaId, ev.tgl, ev.pkg);
        if (r) { f.referral = Math.round((ev.value - f.admin) * refGroupPct / 100); f.refNama = r.nama; f.refGuruId = r.guruId; }
      }
    } else {
      const teach = ev.status === 'Hadir' || (ev.status === 'Alpa' && ev.charge && guruAlpa);
      const t = tarifFor(e, ev.guruId, ev.tgl, ev.pkg);
      if (!t) f.tarifMissing = teach;
      if (t && (teach || ev.charge)) {
        const dur = ev.durasi || num_(e.durasi) || std;
        const fac = dur / std;
        const cv = num_(t.nilaiKelas) * fac;
        const admRaw = String(t.adminFee || '');
        const adm = /%/.test(admRaw) ? Math.round(cv * num_(admRaw) / 100) : num_(admRaw);
        if (ev.charge) { f.admin = adm; f.classroom = num_(t.classroomFee); }
        if (teach) {
          f.feeGuru = num_(t.feeGuruManual) ? Math.round(num_(t.feeGuruManual) * fac) : Math.round((cv - adm) * num_(t.persenGuru) / 100);
          f.travel = num_(e.travelFee !== '' && e.travelFee != null ? e.travelFee : t.travelFee);
        }
        if (ev.charge) {
          const r = refInfo(ev.siswaId, ev.tgl, ev.pkg);
          if (r) { f.referral = Math.round((cv - adm) * num_(t.persenReferral) / 100); f.refNama = r.nama; f.refGuruId = r.guruId; }
        }
      }
    }
    fin.push(f);
  });
  Object.keys(groupSesi).forEach(id => { const g = groupSesi[id]; g.fee = groupFee(g.guruId, g.tgl, g.n); });

  return { pkgs: pkgs, byEnrol: byEnrol, events: events, enrol: enrol, fin: fin, groupSesi: groupSesi };
}

/* ---- rekap bulanan (dipakai halaman Keuangan & Gaji) ---- */
function rekapBulan_(db, st, L, periode) {
  const inP = d => String(d || '').slice(0, 7) === periode;
  const end = periode + '-31';
  const out = { periode: periode, kasMasuk: 0, kasPerJenis: {}, diakui: 0, diakuiSesi: 0, diakuiNonSesi: 0, hangus: 0,
    feeGuru: 0, travel: 0, admin: 0, classroom: 0, referral: 0, margin: 0, saldoPaket: 0, perKategori: {}, guru: {}, referral_: [] };
  (db.Pembelian || []).forEach(p => {
    if (p.status !== 'Lunas' || p.asalId || !inP(p.tglBayar)) return;
    out.kasMasuk += num_(p.total);
    out.kasPerJenis[p.jenis || 'Lainnya'] = (out.kasPerJenis[p.jenis || 'Lainnya'] || 0) + num_(p.total);
    if (num_(p.sesi) + num_(p.bonus) <= 0) { out.diakuiNonSesi += num_(p.total); }
  });
  const kat = k => out.perKategori[k] || (out.perKategori[k] = { nilai: 0, sesi: 0, feeGuru: 0, travel: 0, admin: 0, classroom: 0, referral: 0 });
  const gr = id => out.guru[id] || (out.guru[id] = { privatSesi: 0, privatFee: 0, travel: 0, groupSesi: 0, groupFee: 0, referral: 0, rincian: [] });
  L.fin.forEach(f => {
    if (!inP(f.ev.tgl)) return;
    const k = kat(f.kategori);
    k.nilai += f.nilai; if (f.ev.charge) k.sesi++;
    k.feeGuru += f.feeGuru; k.travel += f.travel; k.admin += f.admin; k.classroom += f.classroom; k.referral += f.referral;
    out.diakuiSesi += f.nilai;
    if (f.ev.mode === 'hangus') out.hangus += f.nilai;
    out.feeGuru += f.feeGuru; out.travel += f.travel; out.admin += f.admin; out.classroom += f.classroom; out.referral += f.referral;
    if (f.tipe === 'Private' && (f.feeGuru || f.travel || f.tarifMissing)) {
      const g = gr(f.guruId); g.privatSesi++; g.privatFee += f.feeGuru; g.travel += f.travel;
      g.rincian.push({ tgl: f.ev.tgl, jenis: f.kategori, lokasi: f.lokasi, siswaId: f.ev.siswaId, status: f.ev.status, fee: f.feeGuru, travel: f.travel, durasi: f.ev.durasi, missing: f.tarifMissing });
    }
    if (f.referral) {
      if (f.refGuruId) { const g = gr(f.refGuruId); g.referral += f.referral; g.rincian.push({ tgl: f.ev.tgl, jenis: 'Referral', siswaId: f.ev.siswaId, fee: f.referral }); }
      out.referral_.push({ tgl: f.ev.tgl, siswaId: f.ev.siswaId, nama: f.refNama, guruId: f.refGuruId, nilai: f.referral });
    }
  });
  Object.keys(L.groupSesi).forEach(id => {
    const g = L.groupSesi[id]; if (!inP(g.tgl)) return;
    const k = kat('Group Class'); k.feeGuru += g.fee; out.feeGuru += g.fee;
    const r = gr(g.guruId); r.groupSesi++; r.groupFee += g.fee;
    r.rincian.push({ tgl: g.tgl, jenis: 'Group Class', kelasId: g.kelasId, n: g.n, fee: g.fee, sesiId: id });
  });
  out.diakui = out.diakuiSesi + out.diakuiNonSesi;
  out.margin = out.diakui - out.feeGuru - out.travel - out.referral;
  // saldo paket (belum terpakai) per akhir bulan
  Object.keys(L.pkgs).forEach(id => {
    const k = L.pkgs[id]; if ((k.tgl || '') > end) return;
    const used = k.awal + k.events.filter(v => v.charge && v.tgl <= end).length;
    const moved = k.moves.filter(m => (m.tglBeli || '') <= end).reduce((a, m) => a + num_(m.sesi) + num_(m.bonus), 0);
    const sisa = Math.max(0, k.credits - used - moved);
    out.saldoPaket += sisa * k.perCredit;
  });
  return out;
}

/* ---------------- ID otomatis (dipakai adapter penyimpanan) ---------------- */
function newId_(name, existing) {
  const seq = (prefix, digits) => {
    let max = 0;
    existing.forEach(r => { const m = String(r.id).match(new RegExp('^' + prefix + '(\\d+)$')); if (m && +m[1] > max) max = +m[1]; });
    return prefix + String(max + 1).padStart(digits, '0');
  };
  if (name === 'Siswa') return seq('DKC', 3);
  if (name === 'Guru') return seq('G', 2);
  if (name === 'KelasGroup') return seq('KG', 2);
  return name.slice(0, 2).toUpperCase() + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function autoFields_(name, r, existing) {
  if (name === 'Pembelian' && !r.noInvoice) {
    const ym = String(r.tglBeli || ENV.today()).slice(0, 7).replace('-', '');
    let max = 0;
    existing.forEach(x => { const m = String(x.noInvoice || '').match(new RegExp('^INV-' + ym + '-(\\d+)$')); if (m && +m[1] > max) max = +m[1]; });
    r.noInvoice = 'INV-' + ym + '-' + String(max + 1).padStart(3, '0');
  }
  if (name === 'Siswa') { if (!r.kodeOrtu) r.kodeOrtu = rand4_(); if (!r.status) r.status = 'Aktif'; if (!r.tglDaftar) r.tglDaftar = ENV.today(); }
  if (name === 'Guru') { if (!r.pin) r.pin = rand4_(); if (!r.status) r.status = 'Aktif'; }
}

function sfListHtml() {
  const f = S.sf; const rows = sfRows(); const staff = isStaff();
  if (f.tipe === 'Group' && !f.kelasId) return '<div class="empty">Pilih kelas group terlebih dahulu.</div>';
  if (!rows.length) return `<div class="empty">${f.tipe === 'Group' ? 'Belum ada murid di kelas ini. Daftarkan murid lewat menu Kelas.' : 'Tidak ada murid private. Centang "Tampilkan semua" bila menggantikan guru lain.'}</div>`;
  return rows.map(e => {
    const s = siswaById(e.siswaId); const cur = f.st[e.id] || ''; const info = enrolInfo(e.id);
    const md = f.md[e.id] || '';
    return `<div class="att-row" id="ar_${e.id}"><div class="avatar" style="background:${cur ? 'var(--mint)' : 'var(--yellow-50)'}">${initials(s.panggilan || s.nama)}</div>
      <div class="meta"><b>${esc(s.nama)}</b><span class="small muted">${esc(e.tipe === 'Group' ? (kelasIdsOf(e).includes(f.kelasId) ? (e.jadwal || 'Group') : 'dari ' + kelasNamaOf(e)) : enrolLabel(e))}${N(e.durasi) && N(e.durasi) !== STD() ? ' · ' + N(e.durasi) + ' mnt' : ''}</span> ${sisaBadge(info)}</div>
      ${staff && cur && cur !== 'Hadir' ? `<select class="input" style="width:auto;padding:6px 8px;font-size:12.5px" title="Potong sesi?" onchange="S.sf.md['${e.id}']=this.value">${[['', 'Otomatis'], ['bebas', 'Tidak dipotong'], ['potong', 'Dipotong']].map(([v, l]) => opt(v, l, md)).join('')}</select>` : ''}
      <div class="seg">${['H', 'I', 'S', 'A'].map(c => { const v = { H: 'Hadir', I: 'Izin', S: 'Sakit', A: 'Alpa' }[c]; return `<button class="${cur === v ? 'on ' + c : ''}" onclick="sfSet('${e.id}','${v}')">${c}</button>`; }).join('')}</div>
      ${cur ? `<button class="icon-btn" title="Batal" onclick="sfSet('${e.id}','')">${ic('x')}</button>` : '<span style="width:34px"></span>'}

function sfSet(eid, v) {
  if (!v || S.sf.st[eid] === v) delete S.sf.st[eid]; else S.sf.st[eid] = v;
  $('#sfList').innerHTML = sfListHtml();
  const c = $('#sfCount'); if (c) c.textContent = Object.keys(S.sf.st).length;
}
function sfAll() { sfRows().forEach(e => { if (!S.sf.st[e.id]) S.sf.st[e.id] = 'Hadir'; }); $('#sfList').innerHTML = sfListHtml(); const c = $('#sfCount'); if (c) c.textContent = Object.keys(S.sf.st).length; }
function sfPickKelas(id) {
  S.sf.kelasId = id; S.sf.st = {}; S.sf.extra = [];
  const k = byId('KelasGroup', id);
  if (k) { if (S.role !== 'guru' && !S.sf.guruId) S.sf.guruId = k.guruId; if (k.jam && !S.sf.id) S.sf.jam = k.jam; S.sf.lokasi = k.lokasi; }
  sfRender();
}
function sfRender() { const el = $('#sfWrap'); if (el) el.innerHTML = sfHtml(); }
async function sfSave() {
  const f = S.sf;
  const hadir = Object.keys(f.st).map(eid => ({ enrolId: eid, status: f.st[eid], catatan: f.nt[eid] || '', mode: f.st[eid] === 'Hadir' ? '' : (f.md[eid] || '') }));
  if (!hadir.length) return toast('Pilih status kehadiran minimal satu murid', true);
  if (S.role !== 'guru' && !f.guruId) return toast('Pilih guru yang mengajar', true);
  if (f.tipe === 'Group' && !f.kelasId) return toast('Pilih kelas group', true);
  let lokasi = f.lokasi;
  if (f.tipe !== 'Group') { const e = enrolById(hadir[0].enrolId); lokasi = e ? e.lokasi : ''; }
  const sesi = { id: f.id, tanggal: f.tanggal, jam: f.jam, durasi: f.durasi, tipe: f.tipe, kelasId: f.tipe === 'Group' ? f.kelasId : '', guruId: f.guruId, lokasi, materi: f.materi, catatan: f.catatan, asisten: f.asisten };
  try {
    const r = await call('saveSesi', { sesi, hadir });
    const sid = r.data.sesi.id;
    dbDel('Hadir', x => x.sesiId === sid);
    dbPut('Sesi', [r.data.sesi]); dbPut('Hadir', r.data.hadir);
    toast('Absensi tersimpan ✅');
    sfNew({ tipe: f.tipe, kelasId: '', guruId: S.role === 'guru' ? S.g.guru.id : f.guruId });
    afterSesiSaved();
  } catch (e) { toast(e.message, true); }
}
function sfDelete() {
  const id = S.sf.id;
  confirmBox('Hapus sesi ini beserta absensinya? Sisa sesi murid akan dihitung ulang.', async () => {
    try {
      await call('delSesi', { id });
      dbDel('Sesi', x => x.id === id); dbDel('Hadir', x => x.sesiId === id);
      toast('Sesi dihapus'); sfNew(); afterSesiSaved();
    } catch (e) { toast(e.message, true); }
  });
}
function afterSesiSaved() { if (S.role === 'guru') renderGuru(); else renderStaff(); }

function replaceRows(t, rows) { dbPut(t, rows); }
async function saveRow(t, row) { const r = await call('save', { table: t, row }); replaceRows(t, [r.row]); return r.row; }
async function saveRows(t, rows) { const r = await call('saveMany', { table: t, rows }); replaceRows(t, r.rows); return r.rows; }
async function removeRow(t, id) { await call('remove', { table: t, id }); dbDel(t, x => x.id === id); }

function siswaRows() {
  const st = S.f.sst || 'Aktif'; const q = (S.f.q || '').toLowerCase();
  const list = D('Siswa').filter(s => (st === 'Semua' || s.status === st) && (!q || (s.nama + ' ' + s.id + ' ' + s.ortu + ' ' + s.panggilan).toLowerCase().includes(q))).sort((a, b) => a.nama.localeCompare(b.nama));

    const en = D('Enrol').filter(e => e.siswaId === s.id && e.status !== 'Selesai' && e.status !== 'Berhenti');

async function saveGabung(from) {

function fbEnrolOpts(sid, sel) {

function fbSiswa(sid) { S.fb.siswaId = sid; const es = D('Enrol').filter(e => e.siswaId === sid && e.status !== 'Selesai' && e.status !== 'Berhenti'); $('#fbEnrol').innerHTML = fbEnrolOpts(sid, es.length === 1 ? es[0].id : ''); fbPaketOpts(); fbCalc(); }
function fbPaketOpts(sel) {
  const e = enrolById($('#fbEnrol').value);

  const list = D('Paket').filter(p => p.aktif !== 'Tidak' && (!p.cabang || p.cabang === cab)).filter(p => {
    if (!e) return p.jenis === 'Registrasi' || p.untuk === 'Semua';

  });

}
function fbHargaSesi() {
  const e = enrolById($('#fbEnrol').value); if (!e) return { v: 0, hint: '' };
  if (e.tipe === 'Group') { const pk = byId('Paket', $('#fbPaket').value); return pk && N(pk.sesi) ? { v: N(pk.harga) / N(pk.sesi), hint: 'harga paket ÷ jumlah sesi' } : { v: 0, hint: '' }; }
  const t = fbTarif(e); if (!t) return { v: 0, hint: 'Tarif guru belum diatur' };
  const fac = (N(e.durasi) || STD()) / STD();
  const sesi = N($('#fbSesi').value);
  if (N(t.hargaPaket) && sesi) return { v: N(t.hargaPaket) / sesi, pkg: N(t.hargaPaket), hint: `harga paket ${rp(t.hargaPaket)} (tarif ${t.kodeLama || 'v' + t.versi})` };
  const v = N(t.nilaiKelas) * fac + N(e.travelFee);
  return { v, hint: `${rp(t.nilaiKelas)}${fac !== 1 ? ` × ${N(e.durasi)}/${STD()} mnt` : ''}${N(e.travelFee) ? ` + transport ${rp(e.travelFee)}` : ''}` };
}
// tarif yang dipakai paket: versi khusus paket (mis. Malang P12) bila ada, selain itu tarif pendaftaran
function fbTarif(e) {
  const base = tarifById(e.tarifId); const pk = $('#fbPaket').value;
  let t = base;
  if (base && pk) {
    const sp = D('TarifPrivat').filter(r => r.guruId === base.guruId && r.kategori === base.kategori && r.lokasi === base.lokasi && r.paketId === pk && r.aktif !== 'Tidak')
      .sort((a, b) => (b.tglBerlaku || '').localeCompare(a.tglBerlaku || ''));
    if (sp.length) t = sp[0];
  }
  const h = $('#fbTarif'); if (h && t && !S.fb.keepTarif) h.value = t.id;
  return t;
}
function fbPickPaket(id) {

  if (p) { $('#fbSesi').value = N(p.sesi) || ''; $('#fbBonus').value = N(p.bonus) || ''; $('#fbIzin').value = N(p.jatahIzin) || ''; $('#fbJenis').value = p.jenis; $('#fbNama').value = p.nama; }

function fbCalc() {
  const hs = fbHargaSesi(); const p = byId('Paket', $('#fbPaket').value);
  $('#fbHs').value = hs.v ? rp(hs.v) : '-'; $('#fbHsHint').textContent = hs.hint;
  if (!S.fb.manualHarga) {
    let h = 0;
    if (p && N(p.harga)) h = N(p.harga);

    $('#fbHarga').value = h || '';
  }
  const tot = N($('#fbHarga').value) + N($('#fbLain').value) - N($('#fbDiskon').value);
  $('#fbTotal').value = rp(tot);

}

function delTarif(id) {

function tarifGroup() {
  const groups = {};
  D('TarifGroup').forEach(r => { const k = r.guruId + '|' + r.tglBerlaku + '|' + r.versi; (groups[k] = groups[k] || []).push(r); });
  const keys = Object.keys(groups).sort((a, b) => guruNama(a.split('|')[0]).localeCompare(guruNama(b.split('|')[0])) || b.split('|')[1].localeCompare(a.split('|')[1]));
  return `<div class="card"><div class="card-head"><h3>Fee guru group class</h3><div class="spacer"></div><button class="btn" onclick="formTG()">${ic('plus')}Tarif group baru</button></div>
  <div class="note bg-yellow" style="margin-bottom:10px">${ic('info')}<span>Fee per sesi tergantung <b>jumlah murid yang HADIR</b>. Contoh: hadir 3 = rate normal, hadir 4+ = dapat insentif. Lebih dari 6 murid memakai kolom 6.</span></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Guru</th><th>Versi</th><th>Berlaku</th>${[1, 2, 3, 4, 5, 6].map(n => `<th class="r">${n} murid</th>`).join('')}<th></th></tr></thead><tbody>
  ${keys.map(k => { const [g, tgl, v] = k.split('|'); const rows = groups[k]; const f = n => { const r = rows.find(x => N(x.jumlahMurid) === n); return r ? rp(r.feeGuru) : '<span class="muted">-</span>'; }; return `<tr><td><b>${esc(guruNama(g))}</b></td><td>${esc(v)}</td><td class="small nowrap">${fmtDate(tgl)}</td>${[1, 2, 3, 4, 5, 6].map(n => `<td class="r small">${f(n)}</td>`).join('')}<td class="act"><button class="icon-btn" onclick="formTG('${k}')">${ic('edit')}</button><button class="icon-btn" title="Versi baru" onclick="formTG('${k}',true)">${ic('plus')}</button></td></tr>`; }).join('') || '<tr><td colspan="10"><div class="empty">Belum ada tarif group.</div></td></tr>'}
  </tbody></table></div></div>`;
}
function formTG(key, dup) {
  let g = '', tgl = todayStr(), v = '01', rows = [];
  if (key) { [g, tgl, v] = key.split('|'); rows = D('TarifGroup').filter(r => r.guruId === g && r.tglBerlaku === tgl && r.versi === v); }
  if (dup) { v = String(N(v) + 1).padStart(2, '0'); tgl = todayStr(); }
  const f = n => { const r = rows.find(x => N(x.jumlahMurid) === n); return r ? N(r.feeGuru) : ''; };
  S.tgKey = key && !dup ? key : '';
  modal('Tarif Group Class', `<form id="fTG" class="form-grid">
    <div class="field"><label>Guru</label><select class="input" name="guruId">${D('Guru').map(x => opt(x.id, x.nama, g)).join('')}</select></div>
    <div class="field"><label>Versi</label><input class="input" name="versi" value="${esc(v)}"></div>
    <div class="field full"><label>Tanggal berlaku</label><input class="input" type="date" name="tglBerlaku" value="${esc(tgl)}"></div>
    ${[1, 2, 3, 4, 5, 6].map(n => `<div class="field"><label>Fee bila ${n} murid hadir${n === 6 ? ' (atau lebih)' : ''}</label><input class="input" type="number" name="f${n}" value="${f(n)}"></div>`).join('')}
  </form>`, `<button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveTG()">Simpan</button>`);
}
async function saveTG() {
  const f = formData($('#fTG'));
  const old = S.tgKey ? D('TarifGroup').filter(r => r.guruId + '|' + r.tglBerlaku + '|' + r.versi === S.tgKey) : [];
  const rows = [];
  for (let n = 1; n <= 6; n++) {
    const ex = old.find(r => N(r.jumlahMurid) === n);
    if (f['f' + n] === '') { if (ex) await removeRow('TarifGroup', ex.id); continue; }
    rows.push(Object.assign(ex ? { id: ex.id } : {}, { guruId: f.guruId, versi: f.versi, tglBerlaku: f.tglBerlaku, jumlahMurid: n, feeGuru: f['f' + n] }));
  }
  try { if (rows.length) await saveRows('TarifGroup', rows); closeModal(); toast('Tarif group tersimpan'); renderPage(); } catch (e) { toast(e.message, true); }
}

/* ================= GAJI GURU (owner) ================= */
function gajiData(p) {
  const R = rekapBulan_(S.db, S.settings, L(), p);
  return D('Guru').map(g => {
    const x = R.guru[g.id] || { privatSesi: 0, privatFee: 0, travel: 0, groupSesi: 0, groupFee: 0, referral: 0, rincian: [] };
    const gj = D('Gaji').find(r => r.guruId === g.id && r.periode === p) || {};
    const total = x.privatFee + x.travel + x.groupFee + x.referral + N(gj.bonus) - N(gj.potongan);
    return { g, x, gj, total };
  }).filter(r => r.total || r.x.privatSesi || r.x.groupSesi || r.gj.id);
}

  </tbody>${list.length ? `<tfoot><tr><td>Total</td><td class="c">${sum(list, r => r.x.privatSesi)}</td><td class="r">${rp(sum(list, r => r.x.privatFee))}</td><td class="r">${rp(sum(list, r => r.x.travel))}</td><td class="c">${sum(list, r => r.x.groupSesi)}</td><td class="r">${rp(sum(list, r => r.x.groupFee))}</td><td class="r">${rp(sum(list, r => r.x.referral))}</td><td></td><td class="r">${rp(sum(list, r => r.total))}</td><td colspan="2"></td></tr></tfoot>` : ''}</table></div></div>`;

async function saveSet(fid) {
  const f = formData($('#' + fid));
  if (f.lokasiTxt !== undefined) {
    f.lokasi = JSON.stringify(f.lokasiTxt.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a[0]).map(a => ({ kode: a[0], nama: a[1] || a[0], rumah: /^y/i.test(a[2] || '') ? 'Ya' : '' })));
    delete f.lokasiTxt;
  }
  if (f.cabangTxt !== undefined) { f.cabang = JSON.stringify(f.cabangTxt.split(',').map(x => x.trim()).filter(Boolean)); delete f.cabangTxt; }
  if (f.kategoriTxt !== undefined) { f.kategori = JSON.stringify(f.kategoriTxt.split(',').map(x => x.trim()).filter(Boolean)); delete f.kategoriTxt; }
  try { const r = await call('saveSettings', { settings: f }); S.settings = r.settings; applyCabang(); toast('Pengaturan tersimpan'); renderStaff(); } catch (e) { toast(e.message, true); }
}
async function savePw() { const f = formData($('#fPw')); try { await call('changePassword', f); toast('Password diganti'); $('#fPw').reset(); } catch (e) { toast(e.message, true); } }

}
